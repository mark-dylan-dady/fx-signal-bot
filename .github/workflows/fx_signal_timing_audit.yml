name: FX Signal Timing Audit (No LINE)

on:
  push:
    branches:
      - fx-signal-audit
    paths:
      - "fx_signal_timing_audit.py"
      - ".github/workflows/fx_signal_timing_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: fx-signal-audit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance python-dotenv

      - name: Run timing diagnostic (LINE disabled)
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python fx_signal_timing_audit.py

      - name: Upload timing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-signal-timing-audit
          path: |
            timing_audit_run.csv
            timing_audit_pairs.csv
            timing_audit_downloads.csv
            timing_audit_events.csv
          if-no-files-found: warn
          retention-days: 14
