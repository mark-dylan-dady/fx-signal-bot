name: FX Signal Bot

on:
  schedule:
    # 5分ごとに自動実行（UTC時間）
    - cron: '*/5 * * * *'
  # 手動実行（Actionsタブからの実行）を許可
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # 書き込み権限を明示的に付与
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance python-dotenv

      - name: Run script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # 手動実行の時だけ 'true' になる判定フラグ
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python fx_signal.py

      # CSVに変更があった場合のみ自動コミット＆プッシュするステップ
      - name: Commit and Push updated CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add signals_history.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update signals_history.csv [skip ci]" && git push)
