name: FX Signal Bot

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Asia/Tokyo"
  # 手動実行（Actionsタブからの実行）を許可
  workflow_dispatch:

# 同時に2つ動いてCSVの保存がぶつからないよう、順番に実行する
concurrency:
  group: fx-signal-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # 書き込み権限を明示的に付与
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance python-dotenv

      - name: Run script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # 手動実行の時だけ 'true' になる判定フラグ
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python fx_signal.py

      # 通貨ペアごとの記録(signals_history_AUDJPY.csv など)に変更があれば保存する
      - name: Commit and Push updated CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add signals_history_*.csv || true
          if git diff --staged --quiet; then
            echo "CSVに変更なし"
          else
            git commit -m "Update signals history [skip ci]"
            git pull --rebase origin main
            git push
          fi
