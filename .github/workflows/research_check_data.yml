
name: ORION Research Data Check

on:
  workflow_dispatch:
  schedule:
    - cron: "10 */6 * * *"

jobs:
  check-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check price data quality
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m fx_research.check_data
