
name: Research Collect Dukascopy

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg[binary]"

      - name: Create download directory
        run: mkdir -p download

      - name: Download AUD/JPY from Dukascopy
        run: |
          npx --yes dukascopy-node@latest \
            -i audjpy \
            -from 2026-11-01T22:00:00Z \
            -to 2026-11-02T00:00:00Z \
            -t m5 \
            -f csv \
            -p bid \
            -dir download \
            -fn audjpy-20261102

      - name: Download EUR/JPY from Dukascopy
        run: |
          npx --yes dukascopy-node@latest \
            -i eurjpy \
            -from 2026-11-01T22:00:00Z \
            -to 2026-11-02T00:00:00Z \
            -t m5 \
            -f csv \
            -p bid \
            -dir download \
            -fn eurjpy-20261102

      - name: Save Dukascopy data to Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m fx_research.collect_dukascopy \
            --audjpy download/audjpy-20261102.csv \
            --eurjpy download/eurjpy-20261102.csv
