
name: Research Direction Ratio Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run direction ratio analysis
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m fx_research.report_direction_ratio_analysis
