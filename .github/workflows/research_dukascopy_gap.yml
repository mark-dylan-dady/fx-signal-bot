
name: Research Dukascopy Gap

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download AUD/JPY M5
        run: |
          npx --yes dukascopy-node@latest \
            -i audjpy \
            -from 2026-11-01T22:00:00Z \
            -to 2026-11-02T00:00:00Z \
            -t m5 \
            -f csv \
            -p bid \
            -dir download \
            -fn audjpy-gap-20261102

      - name: Download EUR/JPY M5
        run: |
          npx --yes dukascopy-node@latest \
            -i eurjpy \
            -from 2026-11-01T22:00:00Z \
            -to 2026-11-02T00:00:00Z \
            -t m5 \
            -f csv \
            -p bid \
            -dir download \
            -fn eurjpy-gap-20261102

      - name: Show downloaded CSV
        run: |
          echo "===== AUD/JPY ====="
          cat download/audjpy-gap-20261102.csv

          echo "===== EUR/JPY ====="
          cat download/eurjpy-gap-20261102.csv
