
name: Research Initialize Database

on:
  workflow_dispatch:

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "psycopg[binary]"

      - name: Initialize research tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m fx_research.init_research_db
