name: AUDJPY Signal Bot

on:
  schedule:
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # 画像更新をGitHubに書き込むための権限
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance matplotlib requests

      - name: Run Trading Bot
        run: python fx_signal.py

      - name: Commit and Push Chart Image
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add trading_chart.png
          git commit -m "Update trading chart image" || exit 0
          git push
