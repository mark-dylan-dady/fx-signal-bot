name: Run FX Signal Bot

on:
  schedule:
    # 毎日日本時間の午前9時17から17:17まで一時間ごと自動実行
    - cron: '17 0-9 * * *'
  workflow_dispatch: # 手動でいつでも動かせるボタンを作ります

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          TZ: 'Asia/Tokyo'
        run: python fx_signal.py
